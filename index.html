<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>سكينة — السبحة والأذكار</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body data-theme="emerald">

  <canvas id="bgCanvas"></canvas>
  <div class="ambient-orb" id="ambientOrb"></div>
  <div class="toast" id="toast">تم إتمام الذكر — تقبّل الله</div>

  <div class="app">
    <!-- الشريط العلوي -->
    <header class="top-bar">
      <button class="icon-btn" id="soundBtn" title="الصوت" aria-label="الصوت">🔊</button>
      <div class="progress-dots" id="progressDots"></div>
      <button class="icon-btn" id="themeBtn" title="تغيير المظهر" aria-label="تغيير المظهر">🎨</button>
    </header>

    <!-- مسرح الذكر والسبحة -->
    <main class="tap-stage" id="tapStage">
      <section class="dhikr-box" id="dhikrBox">
        <div class="category-badge" id="categoryBadge">التسبيح</div>
        <h1 class="dhikr-text" id="dhikrText">سُبْحَانَ اللَّهِ</h1>
        <div class="divider"><span></span><i></i><span></span></div>
        <p class="dhikr-virtue" id="dhikrVirtue">تنزيهٌ لله تعالى يملأ القلب سكينة وطمأنينة</p>
      </section>

      <section class="beads-stage" id="beadsStage">
        <!-- سبحة دائرية (لثيم الزمرد) -->
        <div class="circular-wrap" id="circularWrap">
          <svg class="ring-svg" viewBox="0 0 240 240">
            <circle class="ring-track" cx="120" cy="120" r="102"></circle>
            <circle class="ring-progress" id="circularProgress" cx="120" cy="120" r="102"
              stroke-dasharray="640.88" stroke-dashoffset="640.88"></circle>
          </svg>
          <div id="circularBeads"></div>

          <div class="counter-pill" id="counterPillCircle">
            <span class="count-num" id="countNumCircle">٠</span>
            <span class="count-target" id="countTargetCircle">من ٣٣</span>
          </div>

          <svg class="tassel" id="tassel" viewBox="0 0 24 54">
            <line x1="12" y1="0" x2="12" y2="10" stroke="#e6c35c" stroke-width="2" />
            <circle cx="12" cy="13" r="4.5" fill="#e6c35c" />
            <path d="M8 18 L16 18 L20 52 L14 48 L12 53 L10 48 L4 52 Z" fill="url(#tasselGrad)" />
            <defs>
              <linearGradient id="tasselGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#f7dc88" />
                <stop offset="100%" stop-color="#8c6717" />
              </linearGradient>
            </defs>
          </svg>
        </div>

        <!-- سبحة مقوسة / كونية (لباقي الثيمات) -->
        <div class="arc-wrap hidden" id="arcWrap">
          <svg class="arc-track-line" id="arcLineSvg" viewBox="0 0 400 110" preserveAspectRatio="none">
            <path id="arcPath" d="M -20 35 Q 200 102 420 35" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2" />
          </svg>
          <div class="arc-beads-layer" id="arcBeadsLayer"></div>

          <div class="counter-pill" id="counterPillArc">
            <svg class="counter-ring-mini" viewBox="0 0 124 124">
              <circle cx="62" cy="62" r="58" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="3"></circle>
              <circle id="arcProgress" cx="62" cy="62" r="58" fill="none" stroke="var(--accent)"
                stroke-width="3.5" stroke-linecap="round"
                stroke-dasharray="364.42" stroke-dashoffset="364.42"></circle>
            </svg>
            <span class="count-num" id="countNumArc">٠</span>
            <span class="count-target" id="countTargetArc">من ٣٣</span>
          </div>
        </div>
      </section>
    </main>

    <!-- الشريط السفلي -->
    <footer>
      <div class="bottom-bar">
        <button class="icon-btn" id="resetBtn" title="تصفير العداد" aria-label="تصفير العداد">↺</button>
        <button class="pill-btn" id="adhkarMenuBtn">قائمة الأذكار ▲</button>
        <button class="icon-btn" id="nextBtn" title="الذكر التالي" aria-label="الذكر التالي">⏭</button>
      </div>
      <div class="total-footer" id="totalFooter">مجموع تسبيحاتك اليوم: ٠</div>
      <div class="credit-footer">صُنع بواسطة 
        <a href="https://www.facebook.com/share/1A9QhCgtq3/" target="_blank">أسماء السيد</a>
      </div>
    </footer>
  

  <!-- غطاء الخلفية للقوائم -->
  <div class="overlay" id="overlay"></div>

  <!-- قائمة اختيار الثيمات -->
  <div class="drawer" id="themeDrawer">
    <div class="drawer-handle"></div>
    <div class="drawer-title">اختر مظهر السبحة</div>
    <div class="themes-grid" id="themesGrid"></div>
  </div>

  <!-- قائمة الأذكار -->
  <div class="drawer" id="adhkarDrawer">
    <div class="drawer-handle"></div>
    <div class="drawer-title">الأذكار والتسبيح</div>
    <div class="tabs">
      <button class="tab-btn active" data-cat="morning">أذكار الصباح</button>
      <button class="tab-btn" data-cat="evening">أذكار المساء</button>
      <button class="tab-btn" data-cat="tasbih">سبحة حرة</button>
    </div>
    <div class="dhikr-list" id="dhikrList"></div>
    <form class="custom-form" id="customForm">
      <input type="text" id="customText" placeholder="أضف ذكراً خاصاً بك..." required />
      <input type="number" id="customTarget" value="33" min="1" max="1000" />
      <button type="submit">إضافة</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
